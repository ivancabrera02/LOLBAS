---
Name: dotnet-trace.exe
Description: .NET diagnostic tool for collecting and analyzing ETW (Event Tracing for Windows) traces from running .NET applications.
Aliases:
  - dotnet trace
Author: Iván Cabrera
Created: 2026-08-27
Commands:
  - Command: dotnet trace collect --duration 00:00:01 -- calc.exe
    Description: Launches calc.exe and collects ETW trace data for 1 second during execution
    Usecase: Trace child process execution, capture process creation events and system calls from launched applications for reconnaissance and analysis
    Category: Execution
    Privileges: User
    MitreID: T1059
    OperatingSystem: Windows 10 All, Windows 11 All
    Tags:
      - ETW: ProcessTracing
      - Capability: ProcessExecution
Full_Path:
  - Path: C:\Program Files\dotnet\dotnet-trace.exe
  - Path: C:\Program Files (x86)\dotnet\dotnet-trace.exe
Code_Sample:
  - Code: https://github.com/dotnet/diagnostics/tree/main/src/Tools/dotnet-trace
Detection:
  - IOC: Process creation with command line containing "dotnet trace collect"
Resources:
  - Link: https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-trace
  - Link: https://learn.microsoft.com/en-us/windows/win32/etw/about-event-tracing
Acknowledgement:
  - Person: Iván Cabrera
