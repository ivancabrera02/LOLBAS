---
Name: dotnet-counters.exe
Description: .NET diagnostic tool for monitoring performance counters and runtime metrics of .NET applications in real-time.
Author: Iván Cabrera
Created: 2026-08-27
Commands:
  - Command: dotnet-counters.exe collect --duration 1 -- calc.exe
    Description: Collect performance counter data for the process or command executed
    Usecase: Trace child process execution, capture process creation events and system calls from launched applications for reconnaissance and analysis
    Category: Execute
    Privileges: User
    MitreID: T1059
    OperatingSystem: Windows 10 All, Windows 11 All
    Tags:
      - ETW: ProcessTracing
      - Capability: ProcessExecution
Full_Path:
  - Path: C:\Program Files\dotnet\dotnet-counters.exe
  - Path: C:\Program Files (x86)\dotnet\dotnet-counters.exe
Code_Sample:
  - Code: https://github.com/dotnet/diagnostics/tree/main/src/Tools/dotnet-counters
Detection:
  - IOC: Process creation with command line containing "dotnet counters"
Resources:
  - Link: https://github.com/dotnet/diagnostics
  - Link: https://learn.microsoft.com/en-us/dotnet/core/diagnostics/dotnet-counters
Acknowledgement:
  - Person: Iván Cabrera
